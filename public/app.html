<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InstaDuel</title>
  <meta name="description" content="Ikki Instagram bloger yuzma-yuz. Ovoz bering va kim yutishini o‘zingiz hal qiling.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='12' width='22' height='40' rx='7' fill='%23e02d3c'/%3E%3Crect x='34' y='12' width='22' height='40' rx='7' fill='%232563eb'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;800&display=swap">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="app-bar">
    <a class="brand" href="/" aria-label="InstaDuel bosh sahifa"><span class="wm"><span class="wm-a">Insta</span><span class="wm-b">Duel</span></span></a>
    <span class="pill" id="pill">Kun jangi, 1 va 1</span>
  </header>

  <main>
    <section class="screen" id="screen-jang" aria-live="polite"></section>

    <section class="screen" id="screen-kabinet" hidden>
      <h1 class="screen-title">Shaxsiy kabinet</h1>
      <div id="kabinet-body"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Asosiy menyu">
    <a href="#jang" data-tab="jang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l9 9M20 4l-9 9M8 16l-4 4M16 16l4 4"/></svg>Jang
    </a>
    <a href="#kabinet" data-tab="kabinet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Kabinet
    </a>
  </nav>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-box">
    <h2 class="modal-title" id="modal-title">Natija kartochkasi</h2>
    <div class="tabs" id="card-tabs" role="group" aria-label="Bloger"></div>
    <canvas id="card" width="1080" height="1920" aria-label="Natija kartochkasi"></canvas>
    <p class="modal-hint" id="card-msg" hidden></p>
    <div class="modal-actions">
      <button class="mbtn fill" id="card-dl" type="button">Rasmni yuklab olish</button>
      <button class="mbtn" id="card-share" type="button" hidden>Ulashish</button>
      <button class="mbtn" id="card-tg" type="button">Telegramda ulashish</button>
      <button class="mbtn" id="card-browser" type="button" hidden>Brauzerda ochish (rasmni saqlash uchun)</button>
      <button class="mbtn" id="card-link" type="button">Havolani nusxalash</button>
      <button class="mbtn" id="card-close" type="button">Yopish</button>
    </div>
    <p class="modal-hint" id="card-hint">Instagram hikoyasiga qo‘yish uchun rasmni yuklab oling va Instagram ilovasida Hikoya (Story) sifatida joylang.</p>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
