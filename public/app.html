<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InstaDuel - Telegram Mini App</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Header / Logo -->
    <header>
        <a href="/" class="brand-logo">
            <span class="logo-insta">Insta</span><span class="logo-duel">Duel</span>
        </a>
    </header>

    <div class="container">
        <!-- Aktiv Duel Bo'limi -->
        <div id="activeDuelSection" class="duel-card">
            <h2 style="text-align: center; margin-bottom: 16px; font-size: 20px; color: #94a3b8;">🔥 AKTIV DUEL</h2>
            
            <div class="duel-participants">
                <div class="participant">
                    <img id="p1_img" src="/placeholder.jpg" alt="1-Ishtirokchi">
                    <div id="p1_name" class="participant-name">1-Ishtirokchi</div>
                </div>
                <div style="font-weight: 800; font-size: 22px; color: #ff334b;">VS</div>
                <div class="participant">
                    <img id="p2_img" src="/placeholder.jpg" alt="2-Ishtirokchi">
                    <div id="p2_name" class="participant-name">2-Ishtirokchi</div>
                </div>
            </div>

            <!-- Ikkala tomonga ovoz berish tugmalari -->
            <div class="duel-actions">
                <button class="vote-btn-left" onclick="submitVote('left')">
                    🔴 1-Ishtirokchiga Ovoz
                </button>
                <button class="vote-btn-right" onclick="submitVote('right')">
                    🔵 2-Ishtirokchiga Ovoz
                </button>
            </div>
        </div>

        <!-- Kun G'olibi Bo'limi (Jang tugaganda ko'rinadi) -->
        <div id="dailyWinnerSection" class="daily-winner-card" style="display: none;">
            <h2 style="color: #facc15; font-size: 22px;">👑 KUN G'OLIBI 👑</h2>
            <img id="winnerAvatar" class="winner-avatar" src="" alt="Kun G'olibi">
            <h3 id="winnerName" style="color: #ffffff; font-size: 20px; margin-top: 8px;"></h3>
            <p id="winnerVotes" style="color: #94a3b8; font-size: 15px; margin-top: 4px;"></p>
            
            <button class="download-story-btn" onclick="downloadWinnerStoryJPG()">
                📸 Instagram Story uchun yuklab olish (.jpg)
            </button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
