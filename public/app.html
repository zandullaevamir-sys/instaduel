<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InstaDuel — jang</title>
  <meta name="theme-color" content="#0d0e12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e12'/%3E%3Crect x='10' y='14' width='20' height='36' rx='6' fill='%23ff6a3d'/%3E%3Crect x='34' y='14' width='20' height='36' rx='6' fill='%234c8dff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="app-bar">
    <a class="brand" href="/" aria-label="InstaDuel bosh sahifa">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#f3efe6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 10M23 5L13 15M9 19l-4 4M19 19l4 4M11 17l-3 3M17 17l3 3"/></svg>
      <b>InstaDuel</b>
    </a>
    <span class="pill" id="pill">Jang</span>
  </header>

  <main>
    <section class="screen" id="screen-jang" aria-live="polite"></section>

    <section class="screen" id="screen-liga" hidden>
      <div>
        <h1 class="screen-title">Haftalik liga</h1>
        <p class="screen-sub">Toifa ichida eng ko‘p ball to‘plagan bloger haftaning g‘olibi bo‘ladi. G‘alaba 3 ball, durang 1 ball.</p>
      </div>
      <div class="tabs" id="liga-tabs" role="group" aria-label="Toifa"></div>
      <div class="list" id="liga-list"></div>
    </section>

    <section class="screen" id="screen-turnir" hidden>
      <h1 class="screen-title">Chempionat</h1>
      <div id="turnir-body"></div>
    </section>

    <section class="screen" id="screen-profil" hidden>
      <div>
        <h1 class="screen-title">Profil</h1>
        <p class="screen-sub">Ovozlar anonim hisoblanadi. Har bir duelda bitta brauzerdan bitta ovoz beriladi.</p>
      </div>
      <div class="stat"><b id="my-count">0</b><span>siz bergan ovoz</span></div>
      <div class="list" id="my-votes"></div>
      <a class="link-btn" href="/">Sayt haqida</a>
    </section>
  </main>

  <nav class="tabbar" aria-label="Asosiy menyu">
    <a href="#jang" data-tab="jang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l9 9M20 4l-9 9M8 16l-4 4M16 16l4 4"/></svg>Jang
    </a>
    <a href="#liga" data-tab="liga">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>Liga
    </a>
    <a href="#turnir" data-tab="turnir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>Turnir
    </a>
    <a href="#profil" data-tab="profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Profil
    </a>
  </nav>
</div>
<script src="/app.js"></script>
</body>
</html>
